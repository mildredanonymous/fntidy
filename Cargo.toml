[package]
name = "fntidy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Check file and folder names for portability"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Win32_System_IO"] }
